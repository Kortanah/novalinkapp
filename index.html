<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovaLink App</title>
    <style>
        /* [Your existing CSS remains exactly as you provided it] */
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{
            --blue:#3B82F6;--blue-light:rgba(59,130,246,0.15);--blue-dark:#2563EB;
            --green:rgba(34,197,94,0.15);--green-text:#4ADE80;
            --amber:rgba(251,191,36,0.15);--amber-text:#FCD34D;
            --red:rgba(239,68,68,0.15);--red-text:#F87171;
            --bg:#0F1117;--bg2:#161B27;--bg3:#1E2435;--bg4:#252D40;
            --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
            --text:#E8EAF0;--text2:#8B92A5;--text3:#525A6E;
            --radius:10px;--radius-sm:7px;
        }
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
        ::-webkit-scrollbar{width:4px;height:4px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}
        .topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
        .logo{font-size:15px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
        .logo-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue)}
        .bal-pill{margin-left:auto;background:var(--blue-light);color:var(--blue);font-size:12px;font-weight:600;padding:5px 14px;border-radius:99px;cursor:pointer;border:1px solid rgba(59,130,246,0.3);font-family:inherit;transition:all .15s}
        .bal-pill:hover{background:rgba(59,130,246,0.25)}
        .container{max-width:960px;margin:0 auto;padding:20px 14px}
        .tabs{display:flex;gap:2px;background:var(--bg2);border-radius:var(--radius);padding:4px;margin-bottom:18px;border:1px solid var(--border)}
        .tab{flex:1;text-align:center;padding:8px 8px;border-radius:var(--radius-sm);border:none;background:transparent;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
        .tab.active{background:var(--bg4);color:var(--text);border:1px solid var(--border2)}
        .panel{display:none}.panel.active{display:block}
        .card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px}
        .card-title{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-bottom:12px}
        .field{margin-bottom:12px}
        .field label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px}
        .fi{width:100%;padding:9px 11px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;color:var(--text);background:var(--bg3);outline:none;transition:border-color .15s}
        .fi:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(59,130,246,0.15)}
        textarea.fi{min-height:100px;resize:vertical;line-height:1.65}
        .btn{padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:inherit;transition:all .15s;display:inline-block}
        .btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-dark)}
        .btn-primary:disabled{background:#2a3a5c;color:var(--text3);cursor:not-allowed}
        .btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text2)}.btn-outline:hover{background:var(--bg4);color:var(--text)}
        .btn-danger{background:var(--red);color:var(--red-text);border:1px solid rgba(239,68,68,0.2)}
        .btn-success{background:var(--green);color:var(--green-text);border:1px solid rgba(34,197,94,0.2)}
        .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
        .stat{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px}
        .stat-val{font-size:24px;font-weight:700;color:var(--text)}
        .stat-lbl{font-size:11px;color:var(--text3);margin-top:3px}
        .frow{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:8px;flex-wrap:wrap}
        .divider{border:none;border-top:1px solid var(--border);margin:16px 0}
        .char-count{font-size:11px;color:var(--text3);text-align:right;margin-top:4px}
        .prog-bg{background:var(--bg3);border-radius:99px;height:5px;overflow:hidden;margin:8px 0}
        .prog-bar{height:100%;background:var(--blue);border-radius:99px;transition:width .3s;box-shadow:0 0 6px var(--blue)}
        .log-entry{padding:9px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-size:12px}
        .badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px}
        .b-ok{background:var(--green);color:var(--green-text)}
        .b-err{background:var(--red);color:var(--red-text)}
        .b-info{background:var(--blue-light);color:var(--blue)}
        .tag-chip{display:inline-block;background:var(--blue-light);color:var(--blue);font-size:11px;padding:2px 9px;border-radius:99px;margin:2px;border:1px solid rgba(59,130,246,0.2)}
        .upload-zone{border:1.5px dashed var(--border2);border-radius:var(--radius);padding:22px;text-align:center;cursor:pointer;background:var(--bg3);transition:all .15s}
        .upload-zone:hover,.upload-zone.drag{border-color:var(--blue);background:rgba(59,130,246,0.05)}
        .preview-box{background:var(--bg);border-radius:var(--radius-sm);padding:14px;font-family:'Courier New',monospace;font-size:12px;color:var(--text2);min-height:80px;white-space:pre;overflow-x:auto;border:1px solid var(--border)}
        table{width:100%;border-collapse:collapse;font-size:13px}
        th{text-align:left;font-size:11px;color:var(--text3);padding:9px 10px;border-bottom:1px solid var(--border)}
        td{padding:10px 10px;border-bottom:1px solid var(--border);color:var(--text)}
        .tpl-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px;cursor:pointer;position:relative}
        .tpl-card.selected{border-color:var(--blue);background:rgba(59,130,246,0.07)}
        .tpl-preview{font-family:'Courier New',monospace;font-size:11px;color:var(--text2);background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;margin-top:10px;white-space:pre-wrap;display:none}
        .tpl-card.selected .tpl-preview{display:block}
        .var-tag{display:inline-block;background:rgba(251,191,36,0.15);color:var(--amber-text);border:1px solid rgba(251,191,36,0.25);border-radius:4px;font-size:10px;padding:1px 6px;font-family:monospace}
        input[type=file]{display:none}
        #toast{position:fixed;bottom:20px;right:20px;color:#fff;padding:12px 18px;border-radius:var(--radius);font-size:13px;z-index:999;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;border:1px solid rgba(255,255,255,0.1)}
    </style>
</head>
<body>

<div class="topbar">
    <div class="logo"><div class="logo-dot"></div>NovaLink App</div>
    <button class="bal-pill" id="balBtn" onclick="checkBalance()">⟳ SMS Balance</button>
</div>

<div class="container">
    <div class="tabs">
        <button class="tab active" onclick="switchTab('messaging',this)">Messaging</button>
        <button class="tab" onclick="switchTab('contacts',this)">Contacts</button>
        <button class="tab" onclick="switchTab('converter',this)">CSV Converter</button>
        <button class="tab" onclick="switchTab('templates',this)">Templates</button>
    </div>

    <div id="messaging" class="panel active">
        <div class="grid3" style="margin-bottom:14px">
            <div class="stat"><div class="stat-val" id="statTotal">0</div><div class="stat-lbl">Contacts</div></div>
            <div class="stat"><div class="stat-val" id="statSent">0</div><div class="stat-lbl">Sent</div></div>
            <div class="stat"><div class="stat-val" id="statFail">0</div><div class="stat-lbl">Failed</div></div>
        </div>

        <div class="card">
            <div class="card-title">Quick message</div>
            <div class="grid2">
                <div class="field"><label>Phone</label><input type="tel" id="quickPhone" class="fi" /></div>
                <div class="field"><label>Name</label><input type="text" id="quickName" class="fi" /></div>
            </div>
            <div class="field">
                <select id="quickTplSel" class="fi" onchange="applyTplToQuick()"></select>
                <textarea id="quickMsg" class="fi" oninput="countQ()"></textarea>
                <div class="char-count"><span id="qcc">0</span>/160 | <span id="qpg">1</span> page</div>
            </div>
            <button class="btn btn-primary" id="qBtn" onclick="sendQuick()">Send message</button>
        </div>

        <div class="card">
            <div class="card-title">Broadcast</div>
            <div class="field">
                <label>Recipient Group</label>
                <select id="recipientFilter" class="fi"></select>
            </div>
            <div class="field">
                <select id="broadTplSel" class="fi" onchange="applyTplToBroad()"></select>
                <textarea id="msgBody" class="fi" oninput="countB()"></textarea>
                <div class="char-count"><span id="bcc">0</span>/160 | <span id="bpg">1</span> page</div>
            </div>
            <button class="btn btn-primary" id="sendBtn" onclick="sendBroadcast()">Send Broadcast</button>
            <div id="progWrap" style="display:none;margin-top:10px">
                <div id="progLabel" style="font-size:12px;margin-bottom:4px">0%</div>
                <div class="prog-bg"><div class="prog-bar" id="progBar" style="width:0%"></div></div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Send Log</div>
            <div id="sendLog" style="max-height:200px;overflow-y:auto"></div>
        </div>
    </div>

    <div id="contacts" class="panel">
        <div class="card">
            <div class="upload-zone" onclick="$('cFile').click()">📂 Drop or Click to Load Contacts CSV</div>
            <input type="file" id="cFile" accept=".csv" onchange="loadContacts(event)" />
        </div>
        <div class="card">
            <table id="cTable">
                <thead><tr><th>#</th><th>Name</th><th>Phone</th><th>Tags</th></tr></thead>
                <tbody id="cBody"></tbody>
            </table>
        </div>
    </div>

    <div id="templates" class="panel">
        <div class="card">
            <div id="tplList"></div>
        </div>
        <div class="card">
            <div class="card-title">Manage Template</div>
            <input type="text" id="tplName" class="fi" placeholder="Template Name" style="margin-bottom:10px"/>
            <textarea id="tplBody" class="fi" placeholder="Message..."></textarea>
            <button class="btn btn-primary" onclick="saveTpl()" style="margin-top:10px">Save Template</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
/* ==============================
   CONFIG & STATE
   ============================== */
const CFG = {
    apiKey: 'YOUR_API_KEY_HERE',
    senderId: 'NovaLink',
    delay: 400,
    scriptUrl: "https://script.google.com/macros/s/AKfycbwSClRukG1-slh0NAlx0HNpErRVvOUHgMNAjmZhidZY-9jbbiHBm1WKhhRU5yIcvjOF/exec"
};

let contacts = [];
let templates = [
    { id: 't1', name: 'WiFi Voucher', category: 'Voucher', body: "NovaLink WiFi\nPackage: {{package}}\nCode: {{voucher}}" }
];

const $ = id => document.getElementById(id);

/* ==============================
   CORE UTILS
   ============================== */
function toast(msg, t='') {
    const el = $('toast');
    el.textContent = msg;
    el.style.background = t==='ok'?'#14532D':t==='err'?'#450A0A':'#1E2435';
    el.style.opacity = 1;
    setTimeout(() => el.style.opacity = 0, 3000);
}

function switchTab(id, el) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    $(id).classList.add('active');
    el.classList.add('active');
}

function resolveVars(body, data={}) {
    return body
        .replace(/\{\{name\}\}/gi, data.name || 'Customer')
        .replace(/\{\{voucher\}\}/gi, data.voucher || 'XXXXXXXX')
        .replace(/\{\{package\}\}/gi, data.package || 'Standard')
        .replace(/\{\{phone\}\}/gi, data.phone || '');
}

async function callSMS(to, msg) {
    const url = `${CFG.scriptUrl}?to=${encodeURIComponent(to)}&msg=${encodeURIComponent(msg)}&sender_id=${encodeURIComponent(CFG.senderId)}`;
    const r = await fetch(url);
    return (await r.text()).trim();
}

/* ==============================
   MESSAGING LOGIC
   ============================== */
function countQ() {
    const l = $('quickMsg').value.length;
    $('qcc').textContent = l;
    $('qpg').textContent = Math.ceil(l/160) || 1;
}

function countB() {
    const l = $('msgBody').value.length;
    $('bcc').textContent = l;
    $('bpg').textContent = Math.ceil(l/160) || 1;
}

async function sendQuick() {
    const phone = $('quickPhone').value.trim();
    const name = $('quickName').value.trim();
    const msg = $('quickMsg').value.trim();
    
    if(!phone || !msg) return toast("Phone and Message required", "err");

    const finalMsg = resolveVars(msg, { name, phone });
    $('qBtn').disabled = true;
    
    try {
        const res = await callSMS(phone, finalMsg);
        addLog(name || phone, phone, finalMsg, res === '1000');
        toast("Message Sent!", "ok");
    } catch(e) {
        toast("Error sending", "err");
    }
    $('qBtn').disabled = false;
}

async function sendBroadcast() {
    const rawMsg = $('msgBody').value.trim();
    if(!contacts.length || !rawMsg) return toast("No contacts or message", "err");

    $('sendBtn').disabled = true;
    $('progWrap').style.display = 'block';
    
    let sent = 0;
    for(let i=0; i < contacts.length; i++) {
        const c = contacts[i];
        const finalMsg = resolveVars(rawMsg, c);
        
        try {
            await callSMS(c.phone, finalMsg);
            sent++;
            addLog(c.name, c.phone, finalMsg, true);
        } catch(e) {
            addLog(c.name, c.phone, "Failed", false);
        }
        
        let p = Math.round(((i+1)/contacts.length)*100);
        $('progBar').style.width = p + '%';
        $('progLabel').textContent = p + '%';
        await new Promise(r => setTimeout(r, CFG.delay));
    }
    
    $('sendBtn').disabled = false;
    toast(`Broadcast Complete: ${sent} sent`, "ok");
}

function addLog(name, phone, msg, ok) {
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = `<span class="badge ${ok?'b-ok':'b-err'}">${ok?'Sent':'Fail'}</span> <b>${name}</b>: ${msg.substring(0,30)}...`;
    $('sendLog').prepend(entry);
}

/* ==============================
   CONTACTS & TEMPLATES
   ============================== */
function loadContacts(e) {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = function(f) {
        const lines = f.target.result.split('\n');
        contacts = lines.slice(1).map(l => {
            const [name, phone, tags, voucher, pkg] = l.split(',');
            return { name, phone, tags, voucher, package: pkg };
        }).filter(c => c.phone);
        
        updateUI();
        toast(`${contacts.length} contacts loaded`, "ok");
    };
    reader.readAsText(file);
}

function updateUI() {
    $('statTotal').textContent = contacts.length;
    $('cBody').innerHTML = contacts.map((c, i) => 
        `<tr><td>${i+1}</td><td>${c.name}</td><td>${c.phone}</td><td>${c.tags}</td></tr>`
    ).join('');
    
    const opts = '<option value="">Select Template</option>' + templates.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
    $('quickTplSel').innerHTML = opts;
    $('broadTplSel').innerHTML = opts;
    
    $('tplList').innerHTML = templates.map(t => `
        <div class="tpl-card" onclick="this.classList.toggle('selected')">
            <b>${t.name}</b>
            <div class="tpl-preview">${t.body}</div>
        </div>
    `).join('');
}

function applyTplToQuick() {
    const t = templates.find(x => x.id === $('quickTplSel').value);
    if(t) { $('quickMsg').value = t.body; countQ(); }
}

function applyTplToBroad() {
    const t = templates.find(x => x.id === $('broadTplSel').value);
    if(t) { $('msgBody').value = t.body; countB(); }
}

function saveTpl() {
    const name = $('tplName').value;
    const body = $('tplBody').value;
    if(!name || !body) return;
    templates.push({ id: 't'+Date.now(), name, body });
    updateUI();
    toast("Template Saved", "ok");
}

window.onload = updateUI;
</script>
</body>
</html>
